<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Вставка боковой панели -->
<div id="sidebar"></div>

<div class="content">
    <!-- Вкладка "Главная" -->
    <div class="tab-pane fade show active" id="home">
        <div class="d-flex justify-content-center align-items-center full-height">
            <div class="text-center">
                <h1>Главная</h1>
                <h6>Вы находитесь на сайте, предназначенном для продажи товаров.</h6>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-4">
                <div class="card text-center" style="height: 300px; display: flex; flex-direction: column;
                                justify-content: space-between;">
                    <h5 class="card-header">Товар 1</h5>
                    <p class="price">100р.</p>
                    <p class="card-text">Описание товара</p>
                    <button type="button" class="btn btn-outline-primary">Купить</button>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="card text-center" style="height: 300px; display: flex; flex-direction: column;
                                justify-content: space-between;">
                    <h5 class="card-header">Товар 2</h5>
                    <p class="price">100р.</p>
                    <p class="card-text">Описание товара</p>
                    <button type="button" class="btn btn-outline-primary">Купить</button>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="card text-center" style="height: 300px; display: flex; flex-direction: column;
                                justify-content: space-between;">
                    <h5 class="card-header">Товар 3</h5>
                    <p class="price">100р</p>
                    <p class="card-text">Описание товара</p>
                    <button type="button" class="btn btn-outline-primary">Купить</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
